kind = "mobile"
previewPath = "/tradermind-mobile/"
title = "TraderMind Mobile"
version = "1.0.0"
id = "artifacts/tradermind-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/tradermind-mobile/" ]
localPort = 18463

[services.development]
run = "pnpm --filter @workspace/tradermind-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/tradermind-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/tradermind-mobile", "run", "serve" ]

[services.env]
PORT = "18463"
BASE_PATH = "/tradermind-mobile/"
